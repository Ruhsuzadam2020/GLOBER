<body>

    <div id="crypto-ticker" style="background: #1e1e1e; color: #00ff00; padding: 8px 0; font-family: monospace; border-bottom: 2px solid #333; overflow: hidden; white-space: nowrap;">
    <div id="ticker-content" style="display: inline-block; padding-left: 100%; animation: scroll-left 25s linear infinite;">
        🚀 Piyasa Verileri Yükleniyor...
    </div>
</div>

    <div class="container">
        <div class="header">
            <h1>GLOBER</h1>
        </div>
        <nav class="category-nav" style="display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap;">
    <button onclick="haberleriYukle('global+war+economy', 'global')">🌍 Global</button>
    <button onclick="haberleriYukle('general', 'tr')">🇹🇷 Türkiye</button>
    <button onclick="haberleriYukle('economy', 'tr')">💰 Ekonomi</button>

</nav>

<style>
    .category-nav button {
        padding: 8px 16px; border: none; border-radius: 20px; cursor: pointer;
        background: #34495e; color: white; transition: 0.3s;
    }
    .category-nav button:hover { background: #3498db; }
</style>
       
       <div class="news-slider-container" style="position: relative; width: 100%; max-width: 800px; margin: 20px auto; overflow: hidden; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
    <div id="slider-content">
        </div>
    
    <div id="slider-dots" style="position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px;">
        </div>
</div>

<style>
@keyframes scroll-left {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
}
</style>
